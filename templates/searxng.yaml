name: searxng
display_name: SearXNG
description: Privacy-respecting metasearch engine that aggregates results from many search services without tracking you. Settings live in /etc/searxng/settings.yml in the config volume, created from the image template on first start. Runs without the optional Valkey limiter, so keep it private or behind Cloudflare Access rather than open to the public.
icon: searxng
category: productivity
web: true

# SearXNG publishes rolling date-stamped builds; latest is the upstream
# recommendation. Pin a tag such as 2026.10.30-ffa88e3ba if you need one.
versions:
  - "latest"
default_version: "latest"

config:
  # Overrides server.secret_key in settings.yml.
  - name: secret_key
    label: Secret Key
    type: password
    generate: true
    length: 48
    immutable: true
    required: true

resources:
  cpu: "0.5"
  memory: "512m"

docker:
  image: "searxng/searxng:{{ .Version }}"
  ports:
    - container: 8080
      protocol: tcp
  environment:
    SEARXNG_BASE_URL: "{{ if .Domain }}{{ .Protocol }}://{{ .Domain }}/{{ else }}http://{{ .ContainerName }}:8080/{{ end }}"
    SEARXNG_SECRET: "{{ .Config.secret_key }}"
  volumes:
    - name: config
      path: /etc/searxng
    - name: cache
      path: /var/cache/searxng
  health_check:
    test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/healthz"]
    interval: 10s
    timeout: 5s
    retries: 5

connection:
  internal: "http://{{ .ContainerName }}:8080"
  external: "{{ if .Domain }}{{ .Protocol }}://{{ .Domain }}{{ else }}http://{{ .ContainerName }}:8080{{ end }}"
