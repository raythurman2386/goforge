name: rustgis
display_name: RustGIS
description: RustGIS web app (Rust compiled to WebAssembly, WebGPU or WebGL2) served by unprivileged nginx. Files stay in the browser. Offline start and install-as-app need HTTPS (or localhost), so give it a public HTTPS domain or a .localhost domain.
icon: rustgis
category: gis
web: true

versions:
  - "0.5.0"
  - "latest"
default_version: "0.5.0"

config: []

resources:
  cpu: "0.25"
  memory: "128m"

docker:
  image: "ghcr.io/opengeos/rustgis:{{ .Version }}"
  ports:
    - container: 8080
      protocol: tcp
  environment: {}
  volumes: []
  health_check:
    test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/healthz"]
    interval: 10s
    timeout: 5s
    retries: 5

connection:
  internal: "http://{{ .ContainerName }}:8080"
  external: "{{ if .Domain }}{{ .Protocol }}://{{ .Domain }}{{ else }}http://{{ .ContainerName }}:8080{{ end }}"
