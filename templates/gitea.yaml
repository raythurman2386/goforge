name: gitea
display_name: Gitea
description: Self-hosted Git service written in Go. Gitea listens on HTTP port 3000 and GoForge routes the Domain to it through Traefik, so give it a public HTTPS host such as <name>-app.example.com (proxied Cloudflare CNAME to your tunnel). Gitea keeps PROTOCOL=http behind the proxy and ROOT_URL is the https:// browser URL. SSH (container port 22) is not routed by Traefik; GoForge publishes it on the host at 127.0.0.1:<SSH Port> (2223 by default), loopback only, so clone over HTTPS or over SSH through a jump to the host (ssh -J you@<SSH Domain>). Clone URLs show <SSH Domain>:<SSH Port>. The install page is locked from the first start, and GoForge creates the admin account (gitea-admin by default) with a generated password shown masked on the service page.
icon: gitea
category: devtools
web: true

versions:
  - "1.25.5"
  - "latest"
default_version: "1.25.5"

config:
  - name: app_name
    label: Application Name
    type: text
    default: "Gitea: Git with a cup of tea"
    required: true
  - name: disable_registration
    label: Disable Registration
    type: bool
    default: true
    required: true
  - name: require_signin_view
    label: Require Sign-in to View
    type: bool
    default: true
    required: true
  # The first admin account. GoForge creates it after the first healthy start
  # (see post_start below) and never changes it afterwards: change the
  # password, email, or name in Gitea itself. "admin" is reserved by Gitea.
  - name: admin_username
    label: Admin Username
    type: text
    default: "gitea-admin"
    required: true
  - name: admin_email
    label: Admin Email (blank uses admin@<Domain>)
    type: text
    default: ""
    required: false
  - name: admin_password
    label: Admin Password
    type: password
    generate: true
    length: 32
    immutable: true
    required: true
  # Host port for Gitea SSH. GoForge publishes container port 22 on
  # 127.0.0.1:<ssh_port> only (never 0.0.0.0), so reach it through an SSH jump
  # to the host. Not 22 (the host's own sshd) and not 2222 (the pre-GoForge
  # gitea-backup rollback). Changing it recreates the container on the new port.
  - name: ssh_port
    label: SSH Port (host, 127.0.0.1 only)
    type: number
    default: 2223
    required: true
  # Host name Gitea shows in SSH clone URLs, for example a Tailscale MagicDNS
  # name. Blank falls back to the Domain.
  - name: ssh_domain
    label: SSH Domain (shown in clone URLs)
    type: text
    default: "minis"
    required: false
  # Gitea encrypts stored secrets (2FA, mirror credentials) with SECRET_KEY.
  # It must never change after first start, so it is generated once at deploy
  # and cannot be edited. Instances deployed before this field keep the key
  # Gitea wrote to app.ini.
  - name: secret_key
    label: Secret Key
    type: password
    generate: true
    length: 64
    immutable: true
    required: true

resources:
  cpu: "0.5"
  memory: "512m"

docker:
  image: "gitea/gitea:{{ .Version }}"
  ports:
    - container: 3000
      protocol: tcp
    # SSH: published on loopback only. host_ip defaults to 127.0.0.1;
    # 0.0.0.0 and :: are refused.
    - container: 22
      protocol: tcp
      publish: true
      host_port: "{{ .Config.ssh_port }}"
      host_ip: "127.0.0.1"
  environment:
    USER_UID: "1000"
    USER_GID: "1000"
    # Root-section keys need an empty section: GITEA____KEY. GITEA__APP_NAME is ignored.
    GITEA____APP_NAME: "{{ .Config.app_name }}"
    # Gitea serves plain HTTP. Traefik (and Cloudflare in proxy mode) end TLS in front of it.
    # PROTOCOL=https would make Gitea expect TLS on :3000 and break the route.
    GITEA__SERVER__PROTOCOL: "http"
    GITEA__SERVER__HTTP_PORT: "3000"
    # The port shown in SSH clone URLs: the published host port. Gitea's
    # OpenSSH still listens on 22 inside the container.
    GITEA__SERVER__SSH_PORT: "{{ .Config.ssh_port }}"
    GITEA__SERVER__DOMAIN: "{{ if .Domain }}{{ .Domain }}{{ else }}{{ .ContainerName }}{{ end }}"
    GITEA__SERVER__ROOT_URL: "{{ if .Domain }}{{ .Protocol }}://{{ .Domain }}/{{ else }}http://{{ .ContainerName }}:3000/{{ end }}"
    GITEA__SERVICE__DISABLE_REGISTRATION: "{{ .Config.disable_registration }}"
    GITEA__SERVICE__REQUIRE_SIGNIN_VIEW: "{{ .Config.require_signin_view }}"
    # Lock the installer from the first start so the install page is never served.
    GITEA__security__INSTALL_LOCK: "true"
  optional_environment:
    # Left out when blank so Gitea falls back to DOMAIN.
    GITEA__SERVER__SSH_DOMAIN: "{{ .Config.ssh_domain }}"
    # Left out when empty so an instance deployed before secret_key existed
    # keeps the SECRET_KEY already in its app.ini instead of having it wiped.
    GITEA__security__SECRET_KEY: "{{ .Config.secret_key }}"
  volumes:
    - name: data
      path: /data
  health_check:
    test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/api/healthz"]
    interval: 10s
    timeout: 5s
    retries: 5

# Create the first admin once Gitea is healthy. Runs on every container
# create (deploy, config edit, image update) and does nothing when any admin
# account already exists, so it never touches an existing instance's users.
# Gitea's CLI only takes the password as --password, so it is in that
# command's argv (readable from the host's /proc without hidepid) while it runs.
post_start:
  - name: create-admin
    user: git
    command:
      - sh
      - -c
      - |
        set -eu
        admins=$(gitea admin user list --admin)
        if [ "$(printf '%s\n' "$admins" | tail -n +2 | grep -c . || true)" -gt 0 ]; then
          echo "an admin account already exists; nothing to do"
          exit 0
        fi
        if [ -z "$GITEA_ADMIN_PASSWORD" ]; then
          echo "no admin account exists and admin_password is empty" >&2
          exit 1
        fi
        gitea admin user create --admin \
          --username "$GITEA_ADMIN_USERNAME" \
          --email "$GITEA_ADMIN_EMAIL" \
          --password "$GITEA_ADMIN_PASSWORD" \
          --must-change-password=false
    env:
      GITEA_ADMIN_USERNAME: "{{ .Config.admin_username }}"
      GITEA_ADMIN_EMAIL: "{{ if .Config.admin_email }}{{ .Config.admin_email }}{{ else if .Domain }}admin@{{ .Domain }}{{ else }}admin@{{ .ContainerName }}{{ end }}"
      GITEA_ADMIN_PASSWORD: "{{ .Config.admin_password }}"

connection:
  internal: "http://{{ .ContainerName }}:3000"
  external: "{{ if .Domain }}{{ .Protocol }}://{{ .Domain }}{{ else }}http://{{ .ContainerName }}:3000{{ end }}"
