name: minio
display_name: MinIO
description: High-performance object storage compatible with Amazon S3 API. Uses pgsty/silo, a community build of MinIO (MinIO no longer publishes public images on Docker Hub or Quay).
icon: minio
category: storage
web: true

versions:
  - "latest"
default_version: "latest"

config:
  - name: username
    label: Root User
    type: text
    default: "minioadmin"
    required: true
  - name: password
    label: Root Password
    type: password
    generate: true
    required: true
  - name: console_domain
    label: Console Domain
    type: text
    required: false

resources:
  cpu: "0.5"
  memory: "512m"

docker:
  # MinIO deleted minio/minio from Docker Hub (Sep 2026) and quay.io/minio/minio
  # refuses anonymous pulls. pgsty/silo is a drop-in fork: same /data layout,
  # MINIO_ROOT_* env, health path, and console; its entrypoint maps "server".
  image: "pgsty/silo:{{ .Version }}"
  ports:
    - container: 9000
      protocol: tcp
    # Console. Set Console Domain to route a second host here; the API host
    # then redirects browsers to it instead of to <api host>:9001.
    - container: 9001
      protocol: tcp
      domain: "{{ .Config.console_domain }}"
  environment:
    MINIO_ROOT_USER: "{{ .Config.username }}"
    MINIO_ROOT_PASSWORD: "{{ .Config.password }}"
  optional_environment:
    # Only with a Domain too: without one GoForge adds no console route.
    MINIO_BROWSER_REDIRECT_URL: "{{ if and .Domain .Config.console_domain }}{{ .Protocol }}://{{ .Config.console_domain }}{{ end }}"
  volumes:
    - name: data
      path: /data
  # Before docker.command existed this line was a string GoForge ignored, so
  # the image ran its default CMD. The image entrypoint prepends "minio".
  command: ["server", "/data", "--console-address", ":9001"]
  health_check:
    test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
    interval: 10s
    timeout: 5s
    retries: 5

connection:
  internal: "http://{{ .Config.username }}:{{ .Config.password }}@{{ .ContainerName }}:9000"
  external: "{{ if .Domain }}{{ .Protocol }}://{{ .Domain }}{{ else }}http://{{ .ContainerName }}:9000{{ end }}"
