name: postgres
display_name: PostgreSQL
description: The world's most advanced open source relational database.
icon: postgres
category: database

# A major version change needs a dump and restore: a newer server will not
# start on an older data directory. Pick the version at deploy.
versions:
  - "17"
  - "16"
  - "15"
  - "14"
default_version: "17"

# The postgres image applies POSTGRES_DB, POSTGRES_USER and POSTGRES_PASSWORD
# only when it initialises an empty data volume, so changing them later would
# leave connection_info pointing at an account that does not exist. They are
# immutable: set once at deploy, never changed by a config edit. Change the
# password inside Postgres (ALTER ROLE) if you must rotate it.
# The admin user is pgadmin, not the image default "postgres"; it is still the
# cluster superuser. Apps get their own role and database (see
# scripts/shared-data/pg-tenant.sh), never this account.
config:
  - name: database
    label: Database Name
    type: text
    default: "app"
    immutable: true
    required: true
  - name: username
    label: Admin Username
    type: text
    default: "pgadmin"
    immutable: true
    required: true
  - name: password
    label: Admin Password
    type: password
    generate: true
    length: 32
    immutable: true
    required: true

# Template resources apply on every create and recreate. No GoForge-managed
# postgres instance existed when this was raised from 0.5 CPU / 512m.
resources:
  cpu: "1"
  memory: "1g"

docker:
  image: "postgres:{{ .Version }}"
  ports:
    - container: 5432
      protocol: tcp
  environment:
    POSTGRES_DB: "{{ .Config.database }}"
    POSTGRES_USER: "{{ .Config.username }}"
    POSTGRES_PASSWORD: "{{ .Config.password }}"
  volumes:
    - name: data
      path: /var/lib/postgresql/data
  health_check:
    # Health checks are not rendered as templates; read the user and
    # database from the container environment instead.
    test: ["CMD-SHELL", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
    interval: 10s
    timeout: 5s
    retries: 5

connection:
  internal: "postgres://{{ .Config.username }}:{{ .Config.password }}@{{ .ContainerName }}:5432/{{ .Config.database }}"
