name: redis
display_name: Redis
description: The open source, in-memory data store used by millions of developers as a database, cache, streaming engine, and message broker.
icon: redis
category: database

versions:
  - "7"
  - "6"
default_version: "7"

config:
  - name: password
    label: Password
    type: password
    generate: true
    required: true

resources:
  cpu: "0.25"
  memory: "256m"

docker:
  image: "redis:{{ .Version }}"
  ports:
    - container: 6379
      protocol: tcp
  # The official redis image ignores REDIS_PASSWORD, so the command writes
  # it into a config file and starts redis-server with that file. The
  # password stays out of the command line (docker inspect, ps on the host);
  # it is read from the environment inside the container. The file is
  # mode 600 under /tmp in the container, not in the data volume.
  # The file is recreated on every start (restart, stop/start, daemon
  # reboot). Keep the rm -f: /tmp is sticky and fs.protected_regular=1 makes
  # root's ">" into the old redis-owned file fail with Permission denied.
  # docker-entrypoint.sh still drops to the redis user.
  command:
    - sh
    - -c
    - |
      set -eu
      if [ -z "${REDIS_PASSWORD:-}" ]; then
        echo "goforge: REDIS_PASSWORD is empty, refusing to start without auth" >&2
        exit 1
      fi
      umask 077
      conf=/tmp/goforge-redis.conf
      rm -f "$conf"
      escaped=$(printf '%s' "$REDIS_PASSWORD" | sed 's/[\\"]/\\&/g')
      printf 'requirepass "%s"\n' "$escaped" > "$conf"
      if [ "$(id -u)" = 0 ]; then chown redis "$conf"; fi
      exec docker-entrypoint.sh redis-server "$conf"
  environment:
    REDIS_PASSWORD: "{{ .Config.password }}"
  volumes:
    - name: data
      path: /data
  health_check:
    # redis-cli reads the password from REDISCLI_AUTH, so it is not in argv.
    test: ["CMD-SHELL", "REDISCLI_AUTH=\"$REDIS_PASSWORD\" redis-cli ping | grep PONG"]
    interval: 10s
    timeout: 5s
    retries: 5

connection:
  internal: "redis://:{{ .Config.password }}@{{ .ContainerName }}:6379"
