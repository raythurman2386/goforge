services:
  gocool:
    build: .
    restart: unless-stopped
    environment:
      - GOCOOL_HOST=${GOCOOL_HOST:-0.0.0.0}
      - GOCOOL_PORT=${GOCOOL_PORT:-8080}
      - GOCOOL_DEV_MODE=${GOCOOL_DEV_MODE:-false}
      - GOCOOL_BASE_URL=${GOCOOL_BASE_URL:-http://localhost:8080}
      - DATABASE_URL=${DATABASE_URL:-postgres://gocool:password@db:5432/gocool?sslmode=disable}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - SESSION_SECRET=${SESSION_SECRET}
      - CSRF_SECRET=${CSRF_SECRET}
      - GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID}
      - GITHUB_CLIENT_SECRET=${GITHUB_CLIENT_SECRET}
      - DOCKER_HOST=${DOCKER_HOST:-unix:///var/run/docker.sock}
      - TRAEFIK_NETWORK=${TRAEFIK_NETWORK:-traefik}
      - ACME_EMAIL=${ACME_EMAIL:-admin@example.com}
      - TEMPLATES_DIR=${TEMPLATES_DIR:-./templates}
      - MAX_CONCURRENT_BUILDS=${MAX_CONCURRENT_BUILDS:-2}
      - BUILD_TIMEOUT=${BUILD_TIMEOUT:-15m}
      - ENABLE_METRICS=${ENABLE_METRICS:-true}
      - METRICS_RETENTION=${METRICS_RETENTION:-168h}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - LOG_FORMAT=${LOG_FORMAT:-json}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - gocool_data:/app/data
    depends_on:
      db:
        condition: service_healthy
      traefik:
        condition: service_started
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.gocool.rule=Host(`${GOCOOL_DOMAIN:-localhost}`)"
      - "traefik.http.routers.gocool.entrypoints=websecure"
      - "traefik.http.routers.gocool.tls.certresolver=letsencrypt"
      - "traefik.http.services.gocool.loadbalancer.server.port=${GOCOOL_PORT:-8080}"
      # HTTP to HTTPS redirect
      - "traefik.http.routers.gocool-http.rule=Host(`${GOCOOL_DOMAIN:-localhost}`)"
      - "traefik.http.routers.gocool-http.entrypoints=web"
      - "traefik.http.routers.gocool-http.middlewares=redirect-to-https"
      - "traefik.http.middlewares.redirect-to-https.redirectscheme.scheme=https"
    networks:
      - gocool_net
      - traefik

  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-gocool}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-password}
      - POSTGRES_DB=${POSTGRES_DB:-gocool}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-gocool} -d ${POSTGRES_DB:-gocool}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - gocool_net

  traefik:
    image: traefik:v3.0
    restart: unless-stopped
    command:
      # API and dashboard
      - "--api.dashboard=true"
      - "--api.insecure=${TRAEFIK_DASHBOARD_INSECURE:-false}"
      # Docker provider
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.docker.network=traefik"
      # Entrypoints
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      # Let's Encrypt ACME
      - "--certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL:-admin@example.com}"
      - "--certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json"
      - "--certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web"
      # Logging
      - "--log.level=${TRAEFIK_LOG_LEVEL:-INFO}"
      - "--accesslog=true"
    ports:
      - "80:80"
      - "443:443"
      - "${TRAEFIK_DASHBOARD_PORT:-8081}:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik_letsencrypt:/letsencrypt
    labels:
      # Dashboard routing (optional, requires auth in production)
      - "traefik.enable=true"
      - "traefik.http.routers.traefik-dashboard.rule=Host(`traefik.${GOCOOL_DOMAIN:-localhost}`)"
      - "traefik.http.routers.traefik-dashboard.entrypoints=websecure"
      - "traefik.http.routers.traefik-dashboard.tls.certresolver=letsencrypt"
      - "traefik.http.routers.traefik-dashboard.service=api@internal"
    networks:
      - traefik

  # Redis for session storage and caching (optional but recommended)
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - gocool_net

volumes:
  postgres_data:
  gocool_data:
  traefik_letsencrypt:
  redis_data:

networks:
  gocool_net:
  traefik:
    name: traefik
