services:
  goforge:
    build: .
    restart: unless-stopped
    environment:
      - GOFORGE_HOST=${GOFORGE_HOST:-0.0.0.0}
      - GOFORGE_PORT=${GOFORGE_PORT:-8080}
      - GOFORGE_DEV_MODE=${GOFORGE_DEV_MODE:-false}
      - GOFORGE_BASE_URL=${GOFORGE_BASE_URL:-http://localhost:8080}
      - DATABASE_URL=${DATABASE_URL:?DATABASE_URL is required}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:?ENCRYPTION_KEY is required}
      - SESSION_SECRET=${SESSION_SECRET:?SESSION_SECRET is required}
      - CSRF_SECRET=${CSRF_SECRET:?CSRF_SECRET is required}
      - WEBHOOK_SECRET=${WEBHOOK_SECRET:-}
      - GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID}
      - GITHUB_CLIENT_SECRET=${GITHUB_CLIENT_SECRET}
      - DOCKER_HOST=${DOCKER_HOST:-unix:///var/run/docker.sock}
      - TRAEFIK_NETWORK=${TRAEFIK_NETWORK:-traefik}
      - ACME_EMAIL=${ACME_EMAIL:-admin@example.com}
      - CLOUDFLARE_PROXY_MODE=${CLOUDFLARE_PROXY_MODE:-false}
      - TEMPLATES_DIR=${TEMPLATES_DIR:-./templates}
      - BUILD_TIMEOUT=${BUILD_TIMEOUT:-15m}
      - GOFORGE_ENABLE_REGISTRATION=${GOFORGE_ENABLE_REGISTRATION:-false}
      - GOFORGE_ADMIN_EMAIL=${GOFORGE_ADMIN_EMAIL:-}
      - ENABLE_METRICS=${ENABLE_METRICS:-true}
      - METRICS_RETENTION=${METRICS_RETENTION:-168h}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - LOG_FORMAT=${LOG_FORMAT:-json}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - goforge_data:/app/data
    depends_on:
      db:
        condition: service_healthy
      traefik:
        condition: service_started
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.goforge.rule=Host(`${GOFORGE_DOMAIN:-localhost}`)"
      - "traefik.http.routers.goforge.entrypoints=websecure"
      - "traefik.http.routers.goforge.tls.certresolver=letsencrypt"
      - "traefik.http.services.goforge.loadbalancer.server.port=${GOFORGE_PORT:-8080}"
      # HTTP to HTTPS redirect
      - "traefik.http.routers.goforge-http.rule=Host(`${GOFORGE_DOMAIN:-localhost}`)"
      - "traefik.http.routers.goforge-http.entrypoints=web"
      - "traefik.http.routers.goforge-http.middlewares=redirect-to-https"
      - "traefik.http.middlewares.redirect-to-https.redirectscheme.scheme=https"
    # Loopback only. Traefik on 80/443 is the public entrypoint.
    # 127.0.0.1 still answers http://localhost:8080 on the host.
    ports:
      - "127.0.0.1:${GOFORGE_PORT:-8080}:${GOFORGE_PORT:-8080}"
    networks:
      - goforge_net
      - traefik

  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-goforge}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      - POSTGRES_DB=${POSTGRES_DB:-goforge}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-goforge} -d ${POSTGRES_DB:-goforge}" ]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - goforge_net

  traefik:
    image: traefik:v3.6
    restart: unless-stopped
    command:
      # API and dashboard
      - "--api.dashboard=true"
      - "--api.insecure=${TRAEFIK_DASHBOARD_INSECURE:-false}"
      # Docker provider
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.docker.network=traefik"
      - "--providers.docker.endpoint=unix:///var/run/docker.sock"
      # Entrypoints
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      # Let's Encrypt ACME
      - "--certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL:-admin@example.com}"
      - "--certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json"
      - "--certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web"
      # Logging
      - "--log.level=${TRAEFIK_LOG_LEVEL:-INFO}"
    environment:
      - DOCKER_API_VERSION=1.44
    ports:
      - "80:80"
      - "443:443"
      - "${TRAEFIK_DASHBOARD_PORT:-8081}:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik_letsencrypt:/letsencrypt
    labels:
      # Dashboard routing (optional, requires auth in production)
      - "traefik.enable=true"
      - "traefik.http.routers.traefik-dashboard.rule=Host(`traefik.${GOFORGE_DOMAIN:-localhost}`)"
      - "traefik.http.routers.traefik-dashboard.entrypoints=web"
      - "traefik.http.routers.traefik-dashboard.service=api@internal"
    networks:
      - traefik

  # Cloudflare Tunnel for secure domain management (optional)
  # To use: set CLOUDFLARE_TUNNEL_TOKEN in your environment
  # Get a token from: https://one.dash.cloudflare.com/ -> Zero Trust -> Networks -> Tunnels
  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - goforge
      - traefik
    networks:
      - goforge_net
      - traefik
    profiles:
      - cloudflare

volumes:
  postgres_data:
  goforge_data:
  traefik_letsencrypt:


networks:
  goforge_net:
  traefik:
    name: traefik
