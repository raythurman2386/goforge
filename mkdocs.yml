site_name: GoForge Documentation
site_description: Comprehensive documentation for GoForge - a lightweight, self-hosted PaaS built in Go
site_url: https://raythurman2386.github.io/goforge/
repo_url: https://github.com/raythurman2386/goforge
repo_name: raythurman2386/goforge

theme:
  name: material
  palette:
    - scheme: default
      primary: green
      accent: teal
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: green
      accent: teal
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - toc.follow
  icon:
    repo: fontawesome/brands/github

plugins:
  - search
  - minify:
      minify_html: true

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.details
  - pymdownx.mark
  - pymdownx.critic
  - admonition
  - tables
  - attr_list
  - md_in_html
  - def_list
  - toc:
      permalink: true

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/raythurman2386/goforge

nav:
  - Home: index.md
  - Getting Started:
    - Overview: getting-started/index.md
    - Prerequisites: getting-started/prerequisites.md
    - Quick Start: getting-started/quickstart.md
    - Docker Compose Setup: getting-started/docker-compose.md
  - Architecture:
    - Overview: architecture/index.md
    - Project Structure: architecture/project-structure.md
    - Design Patterns: architecture/design-patterns.md
    - Data Flow: architecture/data-flow.md
  - Configuration:
    - Environment Variables: configuration/index.md
    - Database: configuration/database.md
    - Authentication: configuration/authentication.md
    - Traefik & SSL: configuration/traefik.md
    - Cloudflare Tunnel: configuration/cloudflare.md
  - Guides:
    - Creating Projects: guides/projects.md
    - Deployments: guides/deployments.md
    - One-Click Services: guides/services.md
    - Custom Domains: guides/custom-domains.md
    - Git Integration: guides/git-integration.md
    - Monitoring: guides/monitoring.md
    - MCP Server: guides/mcp.md
  - Deployment:
    - Production Setup: deployment/index.md
    - Docker Compose: deployment/docker-compose.md
    - Systemd: deployment/systemd.md
    - SSL & Certificates: deployment/ssl.md
    - Backup & Restore: deployment/backup.md
  - Development:
    - Contributing: development/index.md
    - Development Setup: development/setup.md
    - Testing: development/testing.md
    - Linting: development/linting.md
    - Database Migrations: development/migrations.md
    - Templates & Frontend: development/frontend.md
  - Reference:
    - API Routes: reference/api-routes.md
    - API v1: reference/api-v1.md
    - Database Schema: reference/database-schema.md
    - Service Templates: reference/service-templates.md
  - Security: security.md
