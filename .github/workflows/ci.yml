name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  GO_VERSION: "1.26"

jobs:
  ci:
    name: CI Pipeline
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: goforge
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: goforge_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Check formatting
        run: make fmt-check

      - name: Generate templates
        run: make templ

      - name: Vet
        run: make vet

      - name: Run tests
        env:
          DATABASE_URL: postgres://goforge:testpassword@localhost:5432/goforge_test?sslmode=disable
        run: make test

      - name: Lint
        uses: golangci/golangci-lint-action@v6
        with:
          # Same version as the go.mod tool pin, so CI and `make lint` agree.
          version: v1.64.8
          args: --timeout=5m
          install-mode: "goinstall"
        env:
          GOTOOLCHAIN: local

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: coverage.out
          fail_ci_if_error: false

  css:
    name: CSS classes (Tailwind 3.4.17)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Pinned to the same Tailwind version as the Dockerfile. Do not move to v4 here.
      - name: Build CSS (Tailwind 3.4.17)
        run: npx --yes tailwindcss@3.4.17 -i static/css/input.css -o static/css/output.css --minify

      - name: Fail on undefined classes
        run: python3 scripts/class_check.py static/css/output.css
