name: Deploy Documentation

on:
  push:
    branches:
      - main
      - cursor/fix-docs-pages-deploy-b599
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - '.github/workflows/docs.yml'
  pull_request:
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

# configure-pages and deploy-pages need pages: write and id-token: write.
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # deploy-pages hides the Pages API errors array behind "Validation Failed".
      # Surface plan, visibility, and source mismatches before the deploy job.
      - name: Check Pages site
        if: github.event_name != 'pull_request'
        uses: actions/github-script@v9
        with:
          script: |
            const { owner, repo } = context.repo
            try {
              const { data } = await github.rest.repos.getPages({ owner, repo })
              core.info(`build_type=${data.build_type} status=${data.status} public=${data.public} url=${data.html_url}`)
              if (data.build_type !== 'workflow') {
                core.setFailed(
                  `GitHub Pages build type is "${data.build_type}". ` +
                  'actions/deploy-pages only works when Settings → Pages → Build and deployment is "GitHub Actions" (build_type "workflow").'
                )
              }
            } catch (error) {
              const status = error.status || error.response?.status || 'unknown'
              const body = error.response?.data ? JSON.stringify(error.response.data) : error.message
              if (status === 404) {
                core.setFailed(`GitHub Pages is not enabled for this repository (${body}). In Settings → Pages, set Build and deployment to GitHub Actions.`)
                return
              }
              core.setFailed(`GitHub Pages request failed (${status}): ${body}`)
            }

      - name: Setup Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install mkdocs-material
          pip install mkdocs-minify-plugin

      - name: Build documentation
        run: mkdocs build --strict

      - name: Upload artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./site

  # Temporary: the github-pages environment only allows main. Add this branch
  # so the deploy job can run before merge, then remove the policy.
  allow-deploy:
    if: github.ref == 'refs/heads/cursor/fix-docs-pages-deploy-b599' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      administration: write
    steps:
      - name: Allow this branch to deploy
        uses: actions/github-script@v9
        with:
          script: |
            const { owner, repo } = context.repo
            try {
              await github.request('POST /repos/{owner}/{repo}/environments/{environment_name}/deployment-branch-policies', {
                owner,
                repo,
                environment_name: 'github-pages',
                name: 'cursor/fix-docs-pages-deploy-b599',
                type: 'branch',
              })
            } catch (error) {
              const status = error.status || error.response?.status || 'unknown'
              const body = error.response?.data ? JSON.stringify(error.response.data) : error.message
              core.setFailed(`Could not allow this branch to deploy (${status}): ${body}`)
            }

  deploy:
    if: github.event_name != 'pull_request'
    needs: [build, allow-deploy]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  cleanup-deploy-policy:
    if: always() && github.ref == 'refs/heads/cursor/fix-docs-pages-deploy-b599' && github.event_name != 'pull_request'
    needs: [allow-deploy, deploy]
    runs-on: ubuntu-latest
    permissions:
      administration: write
    steps:
      - name: Remove temporary branch policy
        uses: actions/github-script@v9
        with:
          script: |
            const { owner, repo } = context.repo
            const { data } = await github.request('GET /repos/{owner}/{repo}/environments/{environment_name}/deployment-branch-policies', {
              owner,
              repo,
              environment_name: 'github-pages',
            })
            for (const policy of data.branch_policies || []) {
              if (policy.name !== 'cursor/fix-docs-pages-deploy-b599') {
                continue
              }
              await github.request('DELETE /repos/{owner}/{repo}/environments/{environment_name}/deployment-branch-policies/{branch_policy_id}', {
                owner,
                repo,
                environment_name: 'github-pages',
                branch_policy_id: policy.id,
              })
              core.info(`Removed deployment branch policy ${policy.id}`)
            }
