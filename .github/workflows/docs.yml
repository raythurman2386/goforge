name: Deploy Documentation

on:
  push:
    branches:
      - main
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - '.github/workflows/docs.yml'
  pull_request:
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

# configure-pages and deploy-pages need pages: write and id-token: write.
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # deploy-pages hides the Pages API errors array behind "Validation Failed".
      # On pull requests this step only records the API response. The deploy job
      # is what publishes, and it cannot run from a non-main branch.
      - name: Check Pages site
        uses: actions/github-script@v9
        with:
          script: |
            const { owner, repo } = context.repo
            const repoInfo = await github.rest.repos.get({ owner, repo })
            core.info(`repository private=${repoInfo.data.private} visibility=${repoInfo.data.visibility}`)
            try {
              const { data } = await github.rest.repos.getPages({ owner, repo })
              core.info(`pages ${JSON.stringify(data)}`)
              if (data.build_type !== 'workflow') {
                core.setFailed(
                  `GitHub Pages build type is "${data.build_type}". ` +
                  'actions/deploy-pages only works when Settings → Pages → Build and deployment is "GitHub Actions" (build_type "workflow").'
                )
              }
            } catch (error) {
              const status = error.status || error.response?.status || 'unknown'
              const body = error.response?.data ? JSON.stringify(error.response.data) : error.message
              if (status === 404) {
                core.setFailed(`GitHub Pages is not enabled for this repository (${body}). In Settings → Pages, set Build and deployment to GitHub Actions.`)
                return
              }
              core.setFailed(`GitHub Pages request failed (${status}): ${body}`)
            }

      - name: Setup Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install mkdocs-material
          pip install mkdocs-minify-plugin

      - name: Build documentation
        run: mkdocs build --strict

      - name: Upload artifact
        id: pages-artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./site

      # Pull requests cannot deploy: the github-pages environment only allows
      # main. Replay the deployment request with the real artifact and print
      # the raw 422 body that actions/deploy-pages discards. Cancel immediately
      # if GitHub accepts the request.
      - name: Probe Pages deployment API
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v9
        env:
          PAGES_ARTIFACT_ID: ${{ steps.pages-artifact.outputs.artifact_id }}
        with:
          script: |
            const { owner, repo } = context.repo
            const artifactId = Number(process.env.PAGES_ARTIFACT_ID)
            const idToken = await core.getIDToken()
            const claims = JSON.parse(Buffer.from(idToken.split('.')[1], 'base64url').toString())
            core.info(`oidc sub=${claims.sub} ref=${claims.ref || ''} environment=${claims.environment || ''} sha=${claims.sha || ''}`)
            core.info(`artifact_id=${artifactId} pages_build_version=${context.sha}`)

            try {
              const { data } = await github.request('POST /repos/{owner}/{repo}/pages/deployments', {
                owner,
                repo,
                artifact_id: artifactId,
                pages_build_version: context.sha,
                oidc_token: idToken
              })
              core.warning(`probe created deployment ${data.id}; canceling`)
              await github.request('POST /repos/{owner}/{repo}/pages/deployments/{deployment_id}/cancel', {
                owner,
                repo,
                deployment_id: data.id
              })
            } catch (error) {
              const data = error.response?.data
              core.info(`pages deployment probe status=${error.status} request-id=${error.response?.headers?.['x-github-request-id']} body=${JSON.stringify(data)}`)
            }

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
