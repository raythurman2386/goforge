name: Deploy Documentation

on:
  push:
    branches:
      - main
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - '.github/workflows/docs.yml'
  pull_request:
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

# configure-pages and deploy-pages need pages: write and id-token: write.
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # deploy-pages hides the Pages API errors array behind "Validation Failed".
      # On pull requests this step only records the API response. The deploy job
      # is what publishes, and it cannot run from a non-main branch.
      - name: Check Pages site
        uses: actions/github-script@v9
        with:
          script: |
            const { owner, repo } = context.repo
            const repoInfo = await github.rest.repos.get({ owner, repo })
            core.info(`repository private=${repoInfo.data.private} visibility=${repoInfo.data.visibility}`)
            try {
              const { data } = await github.rest.repos.getPages({ owner, repo })
              core.info(`pages ${JSON.stringify(data)}`)
              if (data.build_type !== 'workflow') {
                core.setFailed(
                  `GitHub Pages build type is "${data.build_type}". ` +
                  'actions/deploy-pages only works when Settings → Pages → Build and deployment is "GitHub Actions" (build_type "workflow").'
                )
              }
            } catch (error) {
              const status = error.status || error.response?.status || 'unknown'
              const body = error.response?.data ? JSON.stringify(error.response.data) : error.message
              if (status === 404) {
                core.setFailed(`GitHub Pages is not enabled for this repository (${body}). In Settings → Pages, set Build and deployment to GitHub Actions.`)
                return
              }
              core.setFailed(`GitHub Pages request failed (${status}): ${body}`)
            }

            if (context.eventName !== 'pull_request') {
              return
            }

            let idToken = ''
            try {
              idToken = await core.getIDToken()
            } catch (error) {
              core.warning(`OIDC token unavailable: ${error.message}`)
            }

            try {
              await github.request('POST /repos/{owner}/{repo}/pages/deployments', {
                owner,
                repo,
                artifact_id: 0,
                pages_build_version: context.sha,
                oidc_token: idToken
              })
              core.warning('Unexpected success creating a Pages deployment with artifact_id 0')
            } catch (error) {
              const status = error.status || error.response?.status || 'unknown'
              const body = error.response?.data ? JSON.stringify(error.response.data) : error.message
              core.info(`pages deployment probe status=${status} body=${body}`)
            }

      - name: Setup Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install mkdocs-material
          pip install mkdocs-minify-plugin

      - name: Build documentation
        run: mkdocs build --strict

      - name: Upload artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
